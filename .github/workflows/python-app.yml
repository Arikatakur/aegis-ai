name: Aegis AI CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Check README version
        run: uv run python scripts/sync_readme_version.py --check
      - name: Lint
        run: uv run ruff check aegis/ tests/ scripts/
      - name: Test
        run: uv run pytest tests/ -v
      - name: Typecheck
        run: uv run mypy aegis/ --ignore-missing-imports
        continue-on-error: true
