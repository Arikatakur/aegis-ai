[project]
name = "aegis-ai"
version = "0.1.0"
description = "Autonomous local-first LLM red-teaming CLI"
authors = [{ name = "Saleem Yousef", email = "saleem.y.work@hotmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "pydantic>=2",
    "pydantic-settings>=2",
    "python-dotenv>=1",
    "sqlalchemy>=2",
    "alembic>=1.13",
    "litellm>=1.40",
    "jinja2>=3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "tenacity>=8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3",
    "httpx>=0.27",
]

[project.scripts]
aegis = "aegis.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
